<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteMatcher — Sign in / Create account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1A1422; font-family: Inter, sans-serif; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="direction-a.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const App = () => (
  <DesignCanvas title="SiteMatcher — Auth">
    <DCSection id="desktop" title="Desktop · 1440">
      <DCArtboard id="desktop-signin" label="Sign in" width={1440} height={900}>
        <div style={{ width: "100%", height: "100%", overflow: "auto" }}>
          <AuthPage initialMode="signin"/>
        </div>
      </DCArtboard>
      <DCArtboard id="desktop-signup" label="Create account" width={1440} height={950}>
        <div style={{ width: "100%", height: "100%", overflow: "auto" }}>
          <AuthPage initialMode="signup"/>
        </div>
      </DCArtboard>
    </DCSection>
    <DCSection id="mobile" title="Mobile · 390">
      <DCArtboard id="mobile-signin" label="Sign in" width={390} height={900}>
        <div style={{ width: "100%", height: "100%", overflow: "auto" }}>
          <AuthPage initialMode="signin"/>
        </div>
      </DCArtboard>
      <DCArtboard id="mobile-signup" label="Create account" width={390} height={1100}>
        <div style={{ width: "100%", height: "100%", overflow: "auto" }}>
          <AuthPage initialMode="signup"/>
        </div>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
